<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #FFCC00;
            color: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* Style Tombol Home */
        .btn-home {
            display: inline-block;
            background-color: #000000;
            color: #caa613;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn-home:active {
            transform: translateY(0);
        }

        /* Responsif untuk layar HP */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.2rem;
            }
            p {
                font-size: 1rem;
            }
            .btn-home {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <h1>COMING SOON</h1>
    <p>Sesuatu yang indah tidak akan muncul secara instan.</p>
    <a href="/" class="btn-home">Home</a>

</body>
</html>
