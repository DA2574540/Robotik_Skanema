                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Contoh: Qoirul Iman" required />

            <div class="form-group">
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas" name="kelas" placeholder="Contoh: X ELIND 1" required />

            <div class="form-group">
                <label for="nomer">No HP / WhatsApp</label>
                <input type="number" id="nomer" name="nomer" placeholder="08123123123" required />
            </div>

            <div class="form-button">
                <button type="reset" class="btn-danger">Reset</button>
                <button type="submit" class="btn-primary" id="submit">
                    <span class="btn-text">Submit</span>
                    <span class="spinner" id="spinner"></span>
                </button>
            </div>
        </form>
